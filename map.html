<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Love Flipbook</title>
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: #fff0f6;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .flipbook {
      width: 80vw;
      max-width: 500px;
      height: 70vh;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2em;
      position: relative;
      transition: transform 0.5s ease-in-out;
      text-align: center;
    }

    h2 {
      font-family: 'Pacifico', cursive;
      font-size: 2em;
      color: #d6336c;
    }

    p {
      font-size: 1.1em;
      color: #444;
    }

    .controls {
      display: flex;
      gap: 2em;
      margin-top: 1em;
    }

    button {
      background-color: #ff6b81;
      border: none;
      border-radius: 50px;
      color: white;
      font-size: 1.2em;
      padding: 0.5em 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #ff4757;
    }

    .city-image {
      width: 100%;
      height: 200px;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      margin-bottom: 1em;
    }

  </style>
</head>
<body>

<div class="flipbook" id="flipbook">
  <div class="city-image" id="cityImage"></div>
  <h2 id="cityName"></h2>
  <p id="messageText"></p>
  <div class="controls">
    <button onclick="prevCard()">←</button>
    <button onclick="nextCard()">→</button>
 <a href="reasons.html" class="btn">→ 29 Reasons I Love You</a>
  </div>
</div>


<script>
  const cities = [
    {
      name: "Nairobi, Kenya 🇰🇪",
      message: "Where we first met — full of laughter, late-night talks, and unforgettable firsts.",
      image: "https://images.unsplash.com/photo-1584270354949-6df227e87238"
    },
    {
      name: "Dubai, UAE 🇦🇪",
      message: "Where our love deepened — under golden skies and long-distance promises.",
      image: "https://images.unsplash.com/photo-1504271863819-d3b9db1eae7e"
    },
    {
      name: "Perth, Australia 🇦🇺",
      message: "Where we’re headed — a new chapter of hope, adventure, and home together.",
      image: "https://images.unsplash.com/photo-1582298911502-3a23a1c13a92"
    }
  ];

  let index = 0;

  function updateCard() {
    const city = cities[index];
    document.getElementById("cityName").textContent = city.name;
    document.getElementById("messageText").textContent = city.message;
    document.getElementById("cityImage").style.backgroundImage = `url(${city.image})`;
  }

  function nextCard() {
    index = (index + 1) % cities.length;
    updateCard();
  }

  function prevCard() {
    index = (index - 1 + cities.length) % cities.length;
    updateCard();
  }

  updateCard();
</script>

</body>
</html>
