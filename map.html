<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Constellation Love Story</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at center, #0b0c2a 0%, #000 100%);
      overflow: hidden;
      color: white;
      font-family: 'Quicksand', sans-serif;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
    }

    .star {
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 15px 5px #ff6b81;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .star:hover {
      transform: scale(1.2);
    }

    .popup {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #ff6b81;
      border-radius: 10px;
      padding: 1em;
      max-width: 200px;
      display: none;
      color: white;
    }

  </style>
</head>
<body>

<div class="star" style="top: 40%; left: 30%;" onclick="showPopup('popup1')"></div>
<div class="star" style="top: 50%; left: 50%;" onclick="showPopup('popup2')"></div>
<div class="star" style="top: 60%; left: 70%;" onclick="showPopup('popup3')"></div>

<div class="popup" id="popup1" style="top: 42%; left: 33%;">Nairobi 🇰🇪<br>Where it all began 💚</div>
<div class="popup" id="popup2" style="top: 52%; left: 53%;">Dubai 🇦🇪<br>Where our bond grew deeper ✨</div>
<div class="popup" id="popup3" style="top: 62%; left: 73%;">Perth 🇦🇺<br>Where forever begins 🌏</div>

<canvas id="constellationCanvas"></canvas>

<script>
  function showPopup(id) {
    document.querySelectorAll('.popup').forEach(p => p.style.display = 'none');
    document.getElementById(id).style.display = 'block';
  }

  const canvas = document.getElementById('constellationCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawLines();
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawLines() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const stars = [
      { x: 0.3 * canvas.width, y: 0.4 * canvas.height },
      { x: 0.5 * canvas.width, y: 0.5 * canvas.height },
      { x: 0.7 * canvas.width, y: 0.6 * canvas.height }
    ];

    ctx.strokeStyle = '#ff6b81';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(stars[0].x, stars[0].y);
    stars.forEach(s => ctx.lineTo(s.x, s.y));
    ctx.stroke();
  }
</script>

</body>
</html>
