<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Love Story Flipbook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand&family=Pacifico&family=Homemade+Apple&display=swap');

    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #b3001b, #ff6b81);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .flipbook {
      width: 90vw;
      max-width: 500px;
      height: 75vh;
      background: #fff0f5;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(255, 0, 80, 0.3);
      padding: 2em;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      text-align: center;
      border: 2px solid #ff6b81;
      animation: fadeIn 0.8s ease-in-out;
      z-index: 10;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .city-emoji {
      font-size: 5em;
      margin-bottom: 0.5em;
      filter: drop-shadow(0 0 8px #ffcad4);
    }

    h2 {
      font-family: 'Pacifico', cursive;
      font-size: 2em;
      color: #d6336c;
      margin: 0;
      text-shadow: 0 0 5px #ffdde4;
    }

    p {
      font-family: 'Homemade Apple', cursive;
      font-size: 1.4em;
      color: #6e213c;
      background: #fff0f5;
      padding: 1em;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(255, 105, 135, 0.2);
      animation: fadeIn 1.5s ease-in-out;
    }

    .controls {
      display: flex;
      gap: 2em;
      margin-top: 1em;
    }

    button {
      background-color: #ff6b81;
      border: none;
      border-radius: 50px;
      color: white;
      font-size: 1.4em;
      padding: 0.5em 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #e64966;
    }

    .page-number {
      position: absolute;
      bottom: 1em;
      font-size: 0.9em;
      color: #c92a2a;
    }

    .love-btn {
      margin-top: 1.5em;
      background-color: #ff6b81;
      color: white;
      padding: 0.7em 1.2em;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1em;
      text-decoration: none;
      box-shadow: 0 0 10px #ff6b81;
      transition: background 0.3s ease;
    }

    .love-btn:hover {
      background-color: #ff4757;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      color: #ffccd5;
      font-size: 1.5rem;
      animation: floatHearts 8s infinite ease-in-out;
      pointer-events: none;
      opacity: 0.8;
    }

    @keyframes floatHearts {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.7;
      }
      50% {
        transform: translateY(-200px) scale(1.2);
        opacity: 1;
      }
      100% {
        transform: translateY(-400px) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<!-- Floating Hearts -->
<span class="heart" style="left: 15%; bottom: -20px; animation-delay: 0s;">💖</span>
<span class="heart" style="left: 45%; bottom: -30px; animation-delay: 2s;">❤️</span>
<span class="heart" style="left: 75%; bottom: -25px; animation-delay: 4s;">💘</span>

<div class="flipbook" id="flipbook">
  <div class="city-emoji" id="cityEmoji">🌆</div>
  <h2 id="cityName">Nairobi, Kenya 🇰🇪</h2>
  <p id="messageText">Where we first met — full of laughter, late-night talks, and unforgettable firsts.</p>

  <div class="controls">
    <button onclick="prevCard()">←</button>
    <button onclick="nextCard()">→</button>
  </div>

  <a href="reasons.html" class="love-btn">→ 29 Reasons I Love You</a>

  <div class="page-number" id="pageNumber">1 / 3</div>
</div>

<script>
  const cities = [
    {
      emoji: "🌆",
      name: "Nairobi, Kenya 🇰🇪",
      message: "Where we first met — full of laughter, late-night talks, and unforgettable firsts."
    },
    {
      emoji: "🛫",
      name: "Dubai, UAE 🇦🇪",
      message: "Where our love deepened — across time zones, video calls, and sky-high dreams."
    },
    {
      emoji: "🌅",
      name: "Perth, Australia 🇦🇺",
      message: "Where forever begins — calm oceans, soft light, and a future we’ll build side by side."
    }
  ];

  let index = 0;
  let flipbook = document.getElementById("flipbook");

  function updateCard() {
    const city = cities[index];
    document.getElementById("cityEmoji").textContent = city.emoji;
    document.getElementById("cityName").textContent = city.name;
    document.getElementById("messageText").textContent = city.message;
    document.getElementById("pageNumber").textContent = `${index + 1} / ${cities.length}`;

    // Re-trigger animation
    flipbook.style.animation = 'none';
    void flipbook.offsetWidth;
    flipbook.style.animation = 'fadeIn 0.8s ease-in-out';
  }

  function nextCard() {
    index = (index + 1) % cities.length;
    updateCard();
  }

  function prevCard() {
    index = (index - 1 + cities.length) % cities.length;
    updateCard();
  }

  updateCard();
</script>

</body>
</html>
