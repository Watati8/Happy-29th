<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scavenger Hunt</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      overflow-x: hidden;
    }

    .sparkles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 30%, #222 10%, #000 90%);
      background-size: cover;
      z-index: 0;
      overflow: hidden;
    }

    .sparkles::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: url('https://i.imgur.com/3Z3Z8sI.png'); /* working sparkle PNG */
      background-repeat: repeat;
      background-size: 300px;
      opacity: 0.1;
      animation: twinkle 60s linear infinite;
    }

    @keyframes twinkle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-1000px); }
    }

    .hunt {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 4rem auto;
      text-align: center;
      padding: 3rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .hunt h1 {
      font-size: 2.5rem;
      color: #66ffcc;
      margin-bottom: 1.5rem;
    }

    .hunt p {
      font-size: 1.2rem;
      line-height: 1.8;
      margin-bottom: 1rem;
    }

    .hunt p::after {
      content: '🔎';
      animation: pulse 2s infinite;
      display: inline-block;
      margin-left: 5px;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="sparkles"></div>

  <div class="hunt">
    <h1>Scavenger Hunt Begins 🕵️‍♂️</h1>
    <p>There’s a clue waiting for you… but not here.</p>
    <p>Check your email inbox. Look for a message with the subject line: <strong>“Your Next Stop…”</strong> ✉️</p>
    <p>What happens after that? Well… let’s just say things are about to get interesting 😏</p>
    <p>Stay alert, Agent. Your journey has just begun.</p>
  </div>
</body>
</html>
